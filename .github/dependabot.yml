version: 2

# No `reviewers:` keys here. They listed "conradhollomon", which is not a
# collaborator on this repository (only "hollomancer" is), so every request
# silently no-opped. GitHub has also deprecated `reviewers` in Dependabot
# config in favour of CODEOWNERS. On a single-maintainer repository the owner
# is notified of these PRs regardless.
updates:
  # Python dependencies. Declared as "pip"; Dependabot routes this through its
  # uv updater because the project has a uv.lock, which is why the PR branches
  # are named dependabot/uv/*.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group minor and patch updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
