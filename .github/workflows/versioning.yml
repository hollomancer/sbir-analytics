name: Version Policy

# Checks that every version field matches on pull requests and on main.
# Tag pushes are checked by release.yml, which runs
# check_versioning.py --tag before it publishes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate synchronized SemVer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate project versions
        run: python scripts/ci/check_versioning.py
