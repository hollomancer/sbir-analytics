name: CI

# GitHub Actions runs the test suite and nothing else. Data-plane work
# (extraction, enrichment, reporting, image publishing) runs on the self-hosted server
# as Dagster schedules or cron — see docs/deployment/self-hosted-server.md.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NEO4J_IMAGE: "neo4j:5"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "password"  # pragma: allowlist secret
  SBIR_ETL__PIPELINE__ENVIRONMENT: test

jobs:
  quality:
    name: Lint, Types, and Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: "true"
          cache-mypy: "true"
          # Single writer for the shared ~/.cache/uv. This is the shortest job,
          # so the ~9s save lands off the critical path instead of on all five.
          save-uv-cache: "true"

      - name: Run Ruff lint
        run: uv run python -m ruff check sbir_etl packages/sbir-analytics/sbir_analytics packages/sbir-ml/sbir_ml packages/sbir-graph/sbir_graph tests

      - name: Run Ruff format check
        run: uv run python -m ruff format --check sbir_etl packages/sbir-analytics/sbir_analytics packages/sbir-ml/sbir_ml packages/sbir-graph/sbir_graph tests

      - name: Run MyPy type checker
        run: uv run python -m mypy sbir_etl packages/sbir-graph/sbir_graph

      # Importing and validating the complete graph catches duplicate asset
      # keys, unresolved jobs, invalid partition mappings, and missing
      # resources. In-process validation takes about a second once the
      # environment is installed, so keep it on every PR instead of hiding it
      # in the slower integration lane.
      - name: Validate Dagster definitions
        run: |
          uv run python -c \
            "from dagster import Definitions; from sbir_analytics.definitions import defs; Definitions.validate_loadable(defs)"

      - name: Run architecture, documentation, and repository hygiene guards
        run: |
          uv run python scripts/ci/check_architecture_boundaries.py
          uv run python scripts/ci/check_epistemic_tiers.py
          uv run python scripts/ci/check_removed_src_references.py
          uv run python scripts/ci/validate_study_manifests.py
          # Guards the company-identity primitive: a direct RapidFuzz scorer
          # outside sbir_etl.identity is a second, unnamed implementation of
          # the similarity contract. Previously exercised only by its own unit
          # test, which caught accidents but not drift.
          uv run python scripts/ci/check_identity_boundaries.py

      # This file is now the only workflow in the repository, so an invalid
      # ci.yml means CI silently stops running with nothing left to notice.
      # That is not hypothetical: on 2026-08-02 a step left with an empty
      # `env:` (parses as null, which Actions rejects) took weekly.yml out of
      # service for hours. yaml.safe_load accepts that; actionlint does not.
      # Compose validation needs no image and takes about a second, so it
      # lives here rather than behind the docker job's build. That also means
      # it now runs on every PR instead of only when a Docker path changed.

      # Compose validation needs no image and takes about a second, so it
      # lives here rather than behind the docker job's build. That also means
      # it now runs on every PR instead of only when a Docker path changed.
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.server.yml --env-file .env.server.example config -q

      - name: Validate this workflow with actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "$ACTIONLINT_VERSION" >/dev/null
          # shellcheck/pyflakes integration is off: this gate is about workflow
          # schema validity, not the style of the embedded shell.
          ./actionlint -oneline -shellcheck= -pyflakes=

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # detect-secrets compares against the committed baseline; a shallow
          # clone is enough, but the baseline scan walks the working tree.
          fetch-depth: 0

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: "true"

      # Runs alongside the test shards rather than inside `quality`. Measured at
      # ~37s of scan (bandit 10.7s, detect-secrets 25.8s) plus setup, which
      # finishes well inside the ~65s the slowest test shard takes — so it costs
      # a runner and no wall-clock. Folding it into `quality` would instead push
      # that job past the shards and become the new critical path.
      - name: Run Bandit
        run: uv run python -m bandit -r sbir_etl packages -c pyproject.toml

      # Blocking on purpose. This job exists because bandit and detect-secrets
      # ran nowhere after weekly.yml was retired; a non-blocking version would
      # reproduce the state it is meant to fix.
      - name: Run detect-secrets
        run: |
          uv pip install detect-secrets
          uv run detect-secrets scan --baseline .secrets.baseline

  test-fast:
    name: Fast Tests (${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: "true"

      # Unit tests only, minus the slow marker. No Neo4j, no services.
      #
      # Split by recorded duration rather than by test-ID hash. pytest-shard
      # balanced counts, which left one shard reliably drawing the slow tests —
      # shards finished at 60/61/71/77s and the whole run waited on the last.
      # .test_durations is regenerated with `pytest --store-durations -n0`
      # (serially: under xdist the per-test timings include worker wait and are
      # not usable for balancing). Unknown tests get the average, so the file
      # going slightly stale degrades balance rather than breaking the run.
      #
      # xdist still parallelises within each group: measured 25s with `-n auto`
      # against 46s with `-n 0` on a 4-core runner, so both layers earn keep.
      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            -m "not slow" \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --durations-path .test_durations

  test-full:
    name: Full Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: "true"

      - name: Start Neo4j
        uses: ./.github/actions/start-neo4j
        with:
          container-name: test-neo4j
          neo4j-image: ${{ env.NEO4J_IMAGE }}
          neo4j-user: ${{ env.NEO4J_USERNAME }}
          neo4j-password: ${{ env.NEO4J_PASSWORD }}

      # The whole tests/ tree — broader than any previous gate. The old CI only
      # ever ran tests/unit, tests/integration, and tests/e2e, and excluded the
      # slow marker everywhere; tests/functional, tests/golden, tests/slow,
      # tests/mocks, and tests/utils ran nowhere at all.
      #
      # USE_REAL_SBIR_DATA is deliberately unset — the real_data fixtures fall
      # back to sample data, and the bulk corpora live on persistent server storage
      # where no runner can reach them.
      #
      # One exclusion: requires_api needs live external APIs and credentials;
      # it does not belong in CI at all.
      - name: Run full test suite
        env:
          NEO4J_URI: "bolt://localhost:7687"
          NEO4J_USER: ${{ env.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ env.NEO4J_PASSWORD }}
          REQUIRE_NEO4J: "1"
        run: |
          uv run pytest tests/ \
            -m "not requires_api" \
            --cov=sbir_etl \
            --cov=packages/sbir-analytics/sbir_analytics \
            --cov=packages/sbir-ml/sbir_ml \
            --cov=packages/sbir-graph/sbir_graph \
            --cov-report=xml \
            --cov-report=term

      - name: Stop Neo4j
        if: always()
        uses: ./.github/actions/stop-neo4j
        with:
          container-name: test-neo4j

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: full
          name: full-coverage

      - name: Neo4j logs on failure
        if: failure()
        run: docker logs test-neo4j --tail 100 || true

  test-integration:
    name: Neo4j Integration Tests
    needs: [detect-changes]
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: "true"

      - name: Start Neo4j
        uses: ./.github/actions/start-neo4j
        with:
          container-name: test-neo4j
          neo4j-image: ${{ env.NEO4J_IMAGE }}
          neo4j-user: ${{ env.NEO4J_USERNAME }}
          neo4j-password: ${{ env.NEO4J_PASSWORD }}

      # This lane runs alongside the four unit shards. It is conditional on
      # graph/storage changes so ordinary asset and documentation PRs do not
      # pay the container startup cost.
      - name: Run integration tests
        env:
          NEO4J_URI: "bolt://localhost:7687"
          NEO4J_USER: ${{ env.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ env.NEO4J_PASSWORD }}
          REQUIRE_NEO4J: "1"
        run: uv run pytest tests/integration/ -m "integration and not slow"

      - name: Neo4j logs on failure
        if: failure()
        run: docker logs test-neo4j --tail 100 || true

      - name: Stop Neo4j
        if: always()
        uses: ./.github/actions/stop-neo4j
        with:
          container-name: test-neo4j

  detect-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      integration: ${{ steps.filter.outputs.integration }}
      setup: ${{ steps.filter.outputs.setup }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Only what can actually break the image build. The Dockerfile
            # pip-installs pinned versions and never reads uv.lock, so a
            # lockfile bump cannot affect it — including uv.lock here meant
            # every dependabot PR paid a ~2m30s build for nothing. Compose
            # files are gone too: they are validated in `quality` for free.
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
            # Run the real Neo4j contract only when graph persistence or its
            # test harness changes. The full suite still runs after merge.
            integration:
              - 'packages/sbir-graph/**'
              - 'packages/sbir-analytics/sbir_analytics/assets/sbir_neo4j_loading.py'
              - 'packages/sbir-analytics/sbir_analytics/assets/transition/loading.py'
              - 'packages/sbir-analytics/sbir_analytics/assets/uspto/loading.py'
              - 'tests/integration/**'
              - 'tests/conftest.py'
              - 'tests/conftest_shared.py'
              - 'tests/neo4j_service.py'
              - 'pyproject.toml'
              - 'uv.lock'
            # uv.lock and pyproject.toml stay out of the docker filter (#507:
            # the Dockerfile never reads them) but belong here, because
            # setup_dev.sh runs `uv sync` and a lockfile change can genuinely
            # break it.
            setup:
              - 'scripts/setup_dev.sh'
              - 'uv.lock'
              - 'pyproject.toml'

  docker:
    name: Docker Build and Smoke Test
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only, on the runner's native architecture. The question this job
      # answers is "does the image still build and start", and arm64 emulation
      # roughly triples the time without changing the answer. The server builds
      # images for its native architecture; see docs/deployment/self-hosted-server.md.
      - name: Build the ETL image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: sbir-analytics:ci-${{ github.sha }}
          build-args: WITH_R=false
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci

      - name: Smoke test the entrypoint and Dagster definitions
        run: |
          docker run --rm sbir-analytics:ci-${{ github.sha }} dagster --version
          docker run --rm \
            -e SBIR_ETL__PIPELINE__ENVIRONMENT=test \
            sbir-analytics:ci-${{ github.sha }} \
            dagster definitions validate -m sbir_analytics.definitions

  verify-setup-script:
    name: Verify Developer Setup Script
    needs: [detect-changes]
    if: needs.detect-changes.outputs.setup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup_dev.sh invokes `python3.11` by name (line 20), not `python3`, so
      # it depends on that exact interpreter being on PATH. ubuntu-latest
      # happens to ship it today, but the image contents drift and the script
      # would start failing for a reason unrelated to the change under test.
      # Pin it explicitly.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run setup script
        run: bash scripts/setup_dev.sh

      # Reproduce the original ci.yml assertions: venv activates, pydantic imports.
      - name: Assert venv activates and pydantic imports
        run: |
          source .venv/bin/activate
          python -c "import pydantic"
