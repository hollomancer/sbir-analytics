name: Setup Python and UV
description: Standardized Python setup with UV package manager and dependency installation

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.11"
  install-dev-deps:
    description: |
      Whether to install dev dependencies. When "true", installs the
      `stack-dev` meta-extra (covers sbir-etl[dev] plus the workspace
      packages: sbir-ml, sbir-graph, sbir-analytics — the
      latter pulling in dagster). When "false", runs `uv sync --no-dev`.
    required: false
    default: "true"
  cache-mypy:
    description: |
      Whether to cache .mypy_cache. Only the job that runs mypy wants this;
      measured 29s cold vs 0.6s warm on a 94 MB cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache UV installation
      uses: actions/cache@v5
      id: cache-uv
      with:
        path: |
          $HOME/.cargo/bin/uv
          $HOME/.local/bin/uv
        key: uv-binary-${{ runner.os }}-latest
        restore-keys: |
          uv-binary-${{ runner.os }}-

    - name: Install UV
      if: steps.cache-uv.outputs.cache-hit != 'true'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: bash

    - name: Add UV to PATH
      if: steps.cache-uv.outputs.cache-hit == 'true'
      run: |
        # UV might be in cargo bin or local bin
        if [ -f "$HOME/.cargo/bin/uv" ]; then
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        elif [ -f "$HOME/.local/bin/uv" ]; then
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        else
          # Fallback: install if not found in cache
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi
      shell: bash

    # .venv is deliberately NOT cached. uv builds the venv by hardlinking out
    # of ~/.cache/uv, which is measured at 0.2s for this 824 MB environment —
    # far cheaper than downloading and extracting a ~300 MB venv tarball, and
    # `uv sync` had to run afterwards anyway. Caching ~/.cache/uv below is what
    # actually makes that 0.2s possible; keep that one.
    - name: Cache UV cache directory
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
        key: uv-cache-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
        restore-keys: |
          uv-cache-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/uv.lock') }}
          uv-cache-${{ runner.os }}-${{ inputs.python-version }}-
          uv-cache-${{ runner.os }}-

    - name: Cache mypy incremental cache
      if: inputs.cache-mypy == 'true'
      uses: actions/cache@v5
      with:
        path: .mypy_cache
        key: mypy-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('sbir_etl/**/*.py', 'packages/sbir-graph/sbir_graph/**/*.py', 'pyproject.toml') }}
        restore-keys: |
          mypy-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Install dependencies
      run: |
        # `stack-dev` is the meta-extra that includes sbir-etl[dev] plus the
        # three workspace packages (sbir-ml, sbir-graph, sbir-analytics).
        # Without it, tests that import dagster, neo4j loaders, or ML pieces
        # fail with ModuleNotFoundError.
        # `stack-dev` already resolves pyreadstat (via the `uspto` extra), so
        # there is no separate pyreadstat install step here. There used to be
        # one, plus a pip cache to feed it; both were reinstalling a package
        # `uv sync` had just installed.
        if [ "${{ inputs.install-dev-deps }}" = "true" ]; then
          uv sync --extra stack-dev
        else
          uv sync --no-dev
        fi
      shell: bash
