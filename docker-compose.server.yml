# Tailscale-Only Self-Hosted Server Compose Configuration
#
# A private server profile for a single always-on host. Images are built for the
# container runtime's native architecture.
# It runs only the services needed for the orchestration UI:
#   - dagster-code-server (shared internal Dagster code location)
#   - dagster-webserver  (orchestration UI, production mode)
#   - dagster-daemon     (schedules/sensors)
#
# Security boundary:
#   * Every host port is hardcoded to 127.0.0.1. Nothing binds to 0.0.0.0, so
#     no service is reachable over the LAN.
#   * Tailscale Serve is the ONLY ingress (tailnet-only HTTPS/TLS):
#       443  -> Dagster (127.0.0.1:3000)
#   * Tailscale Funnel is prohibited (see docs/deployment/self-hosted-server.md).
#
# Usage:
#   cp .env.server.example .env.server
#   make server-check
#   make server-up
#
# This file runs under an isolated Compose project (name: sbir-server) so it
# never collides with the dev/ci stack in docker-compose.yml.

name: sbir-server

x-server-environment: &server-environment
  ENVIRONMENT: ${ENVIRONMENT:-prod}
  SBIR_ETL__PIPELINE__ENVIRONMENT: ${ENVIRONMENT:-prod}
  PYTHONPATH: /app
  PYTHONUNBUFFERED: 1
  SERVICE_STARTUP_TIMEOUT: ${SERVICE_STARTUP_TIMEOUT:-120}
  # Heavy assets (ML, fiscal, USPTO NLP) are loaded so they can be run by hand;
  # nothing schedules them. See .env.server.example for the capacity caveat.
  DAGSTER_LOAD_HEAVY_ASSETS: ${DAGSTER_LOAD_HEAVY_ASSETS:-true}
  # Shared Dagster home so webserver and daemon read the same schedule state.
  DAGSTER_HOME: /app/dagster_home
  # Schedule gating (see packages/sbir-analytics/sbir_analytics/definitions.py).
  SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_CORE_REFRESH_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_CORE_REFRESH_ENABLED:-false}
  SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_CORE_REFRESH_JOB: ${SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_CORE_REFRESH_JOB:-0 3 * * 0}
  SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_NSF_DEFENSE_LINEAGE_REFRESH_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_NSF_DEFENSE_LINEAGE_REFRESH_ENABLED:-false}
  SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_NSF_DEFENSE_LINEAGE_REFRESH_CRON: ${SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_NSF_DEFENSE_LINEAGE_REFRESH_CRON:-0 5 8 * *}
  # Explicit opt-in: a single fiscal-year archive is narrower than the full DB.
  SBIR_ETL__TRANSITION__CONTRACTS__USE_AWARD_ARCHIVE: ${SBIR_ETL__TRANSITION__CONTRACTS__USE_AWARD_ARCHIVE:-false}
  # Source-download schedules. --env-file only supplies Compose interpolation,
  # so every variable the code reads must be mapped explicitly here or it never
  # reaches the container.
  SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_SBIR_AWARDS_DOWNLOAD_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_SBIR_AWARDS_DOWNLOAD_ENABLED:-false}
  SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_SAM_GOV_DOWNLOAD_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_SAM_GOV_DOWNLOAD_ENABLED:-false}
  SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_USASPENDING_DOWNLOAD_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_USASPENDING_DOWNLOAD_ENABLED:-false}
  SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_USPTO_DOWNLOAD_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_USPTO_DOWNLOAD_ENABLED:-false}
  SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_PHASE_TRANSITION_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__MONTHLY_PHASE_TRANSITION_ENABLED:-false}
  SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_AWARDS_REPORT_ENABLED: ${SBIR_ETL__DAGSTER__SCHEDULES__WEEKLY_AWARDS_REPORT_ENABLED:-false}
  # Pipeline-chaining sensors.
  SBIR_ETL__DAGSTER__SENSORS__SBIR_PIPELINE_AFTER_DOWNLOAD_ENABLED: ${SBIR_ETL__DAGSTER__SENSORS__SBIR_PIPELINE_AFTER_DOWNLOAD_ENABLED:-false}
  SBIR_ETL__DAGSTER__SENSORS__USPTO_PIPELINE_AFTER_DOWNLOAD_ENABLED: ${SBIR_ETL__DAGSTER__SENSORS__USPTO_PIPELINE_AFTER_DOWNLOAD_ENABLED:-false}
  SBIR_ETL__DAGSTER__SENSORS__USASPENDING_PIPELINE_AFTER_DOWNLOAD_ENABLED: ${SBIR_ETL__DAGSTER__SENSORS__USASPENDING_PIPELINE_AFTER_DOWNLOAD_ENABLED:-false}
  SBIR_ETL__DAGSTER__SENSORS__PHASE_TRANSITION_ARCHIVE_AFTER_ANALYSIS_ENABLED: ${SBIR_ETL__DAGSTER__SENSORS__PHASE_TRANSITION_ARCHIVE_AFTER_ANALYSIS_ENABLED:-false}
  # Downloader credentials. Empty by default so the jobs fail with their own
  # actionable message rather than a Compose interpolation error.
  SAM_GOV_API_KEY: ${SAM_GOV_API_KEY:-}
  USPTO_ODP_API_KEY: ${USPTO_ODP_API_KEY:-}
  # Data root for downloads; the server profile points this at persistent storage.
  SBIR_ETL__PATHS__DATA_ROOT: ${SBIR_ETL__PATHS__DATA_ROOT:-/app/data}
  # NSF defense-lineage release inputs and file-only outputs. Path lists use
  # the container's colon separator; see the self-hosted server runbook before editing.
  SBIR_ETL__NSF_DEFENSE_LINEAGE__ANALYSIS_DATE: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__ANALYSIS_DATE:-}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__OUTPUT_DIR: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__OUTPUT_DIR:-/app/data/processed/nsf_sbir_defense_lineage}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__SBIR_AWARDS_PATH: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__SBIR_AWARDS_PATH:-/app/data/raw/sbir/award_data.csv}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__DIRECT_NSF_SOURCES: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__DIRECT_NSF_SOURCES:-}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__NSF_MAX_WORKERS: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__NSF_MAX_WORKERS:-8}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_API_SNAPSHOTS: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_API_SNAPSHOTS:-}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_API_PARQUETS: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_API_PARQUETS:-}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__FETCH_PRIME_API: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__FETCH_PRIME_API:-false}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_CONTRACT_ARCHIVES: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_CONTRACT_ARCHIVES:-}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_ARCHIVE_PARQUETS: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__PRIME_ARCHIVE_PARQUETS:-}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__SUBAWARD_SOURCES: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__SUBAWARD_SOURCES:-}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__MAX_RELEASE_AGE_DAYS: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__MAX_RELEASE_AGE_DAYS:-45}
  SBIR_ETL__NSF_DEFENSE_LINEAGE__GRAPH_OUTPUT: ${SBIR_ETL__NSF_DEFENSE_LINEAGE__GRAPH_OUTPUT:-/app/artifacts/sbir-dib-network-explorer/data/network.json}

services:
  # ===========================================================================
  # Dagster code location (internal gRPC; never published to the host)
  # ===========================================================================
  dagster-code-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${IMAGE_NAME:-sbir-analytics}:${IMAGE_TAG:-local}
    container_name: ${DAGSTER_CODE_SERVER_CONTAINER_NAME:-sbir-server-dagster-code}
    profiles:
      - server
    environment:
      <<: *server-environment
      ENV_DAGSTER_CMD: dagster api grpc --host 0.0.0.0 --port 4000 --module-name sbir_analytics.definitions --location-name sbir-analytics-production
    command: ["sh", "/app/scripts/docker/entrypoint.sh", "dagster-code-server"]
    volumes:
      - ./config:/app/config:rw
      - ${SERVER_REPORTS_DIR:-./reports}:/app/reports:rw
      - ${SERVER_LOGS_DIR:-./logs}:/app/logs:rw
      - ${SERVER_DATA_DIR:-./data}:/app/data:rw
      - ${SERVER_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:rw
      - dagster_home:/app/dagster_home
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD
        - dagster
        - api
        - grpc-health-check
        - --host
        - localhost
        - --port
        - "4000"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sbir-server-network
    restart: ${SERVER_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          # DefaultRunLauncher starts ETL subprocesses through this gRPC
          # server, so the execution budget belongs here rather than on the
          # lightweight daemon.
          memory: 3G
        reservations:
          memory: 1G

  # ===========================================================================
  # Dagster webserver (production mode via the existing entrypoint)
  # ===========================================================================
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${IMAGE_NAME:-sbir-analytics}:${IMAGE_TAG:-local}
    container_name: ${DAGSTER_WEBSERVER_CONTAINER_NAME:-sbir-server-dagster-web}
    profiles:
      - server
    environment:
      <<: *server-environment
      # Healthchecks run inside the container; DAGSTER_PORT is the host mapping.
      HEALTHCHECK_PORT: "3000"
      HEALTHCHECK_PATH: ${DAGSTER_HEALTH_PATH:-/server_info}
      ENV_DAGSTER_CMD: dagster-webserver -h 0.0.0.0 -p 3000 -w /app/workspace.server.yaml
    # The entrypoint performs dependency checks, then uses the explicit
    # production command above to connect to the shared code location.
    command: ["sh", "/app/scripts/docker/entrypoint.sh", "dagster-webserver"]
    volumes:
      - ./config:/app/config:rw
      - ${SERVER_REPORTS_DIR:-./reports}:/app/reports:rw
      - ${SERVER_LOGS_DIR:-./logs}:/app/logs:rw
      - ${SERVER_DATA_DIR:-./data}:/app/data:rw
      - ${SERVER_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:rw
      - dagster_home:/app/dagster_home
    ports:
      # Loopback-only; Tailscale Serve maps HTTPS 443 -> 127.0.0.1:3000.
      - "127.0.0.1:${DAGSTER_PORT:-3000}:3000"
    depends_on:
      dagster-code-server:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/app/scripts/docker/healthcheck/dagster.sh"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sbir-server-network
    restart: ${SERVER_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # ===========================================================================
  # Dagster daemon (schedules + sensors + run launcher)
  # ===========================================================================
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${IMAGE_NAME:-sbir-analytics}:${IMAGE_TAG:-local}
    container_name: ${DAGSTER_DAEMON_CONTAINER_NAME:-sbir-server-dagster-daemon}
    profiles:
      - server
    environment:
      <<: *server-environment
      # The daemon runs in a separate container; localhost would point back to
      # itself and make the startup gate wait for the full timeout.
      DAGSTER_HOST: dagster-webserver
      HEALTHCHECK_PORT: 3000
      HEALTHCHECK_PATH: ${DAGSTER_HEALTH_PATH:-/server_info}
      ENV_DAGSTER_CMD: dagster-daemon run -w /app/workspace.server.yaml
    command: ["sh", "/app/scripts/docker/entrypoint.sh", "dagster-daemon"]
    volumes:
      - ./config:/app/config:rw
      - ${SERVER_REPORTS_DIR:-./reports}:/app/reports:rw
      - ${SERVER_LOGS_DIR:-./logs}:/app/logs:rw
      - ${SERVER_DATA_DIR:-./data}:/app/data:rw
      - ${SERVER_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:rw
      - dagster_home:/app/dagster_home
    depends_on:
      dagster-code-server:
        condition: service_healthy
      dagster-webserver:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/app/scripts/docker/healthcheck/daemon.sh"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sbir-server-network
    restart: ${SERVER_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  # Shared Dagster metadata (schedule ticks, run storage) across web + daemon.
  dagster_home:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  sbir-server-network:
    name: sbir-server-network
    driver: bridge
