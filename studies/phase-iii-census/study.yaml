identity_policy:
  strategy: exact normalized UEI only; no name or DUNS fallback
  version: phase-0-r16
  negative_evidence_allowed: false
materialization:
  allowed: true
  blockers: []
validation_design:
  addressable_population: >-
    The frozen exact-UEI SBIR Phase II award-to-contract pair universe at the
    2026-02-06 data cut (53,890,816 pairs; 72,996 unique prior awards; 8,938
    firms), compared against 500 placebo frames drawn from the frozen R15
    cross-firm completion-date derangement family with seeds 20260802-20261301.
  expected_yield: >-
    One final-cumulative-clause metric row and six sensitivity cells per seed,
    plus the same for the actual frame; an exceedance share with a Wilson 95%
    interval for the primary statistic and for each secondary metric and cell.
  decision_threshold: >-
    Threshold met if and only if the Wilson 95% lower bound on the share of
    draws in which the actual frame strictly exceeds the placebo frame on
    surviving_pairs at the final cumulative clause (exact_naics_or_psc_lineage)
    is at least 0.95. Ties are not exceedances. Secondary metrics and cells
    carry no threshold; dollar totals are descriptive.
  threshold_derivation: >-
    0.95 is the conventional one-sided level for an observed value sitting in
    the upper tail of an empirical null; it was fixed without reference to any
    draw beyond the single R15 sign, and the R15 seed is excluded from the
    confirmatory sample because its result was visible. Requiring the interval
    lower bound rather than the point estimate follows the #726 rule that a
    validated result carries its uncertainty. With N = 500 the rule tolerates
    at most 15 non-exceedances.
  threshold_basis: proportion
  threshold_value: 0.95
permitted_claims:
  - The estimand, criteria, and implementation are frozen and fixture-verified.
  - The complete February cumulative ladder and all six sensitivity cells were
    materialized from provenance-verified inputs, and the blocking one-factor check passed.
  - Within the exact-match common-support subset, the frozen criteria produce different
    full-set clearing proportions but substantially overlapping firm distributions.
  - Under the frozen fixed-seed cross-firm completion-date placebo, the actual frame
    exceeds the placebo frame on every complete-filter metric and in all six sensitivity
    cells; this is descriptive falsification evidence, not labeled validation.
limitations:
  - The materialized placebo is one non-uniform cyclic derangement, not an inferential
    permutation distribution; labeled validation remains unresolved, so no headline
    census cell, undercount claim, or statutory Phase III interpretation is authorized.
  - A permutation-separation validation design (Revision 16) is frozen but has not run;
    no validation result is recorded and the rank is unchanged. When it runs, a met
    threshold will mean separation from the frozen placebo family, not that the proxy
    identifies statutory Phase III awards.
  - Negative-control inference is restricted to the frozen exact-match common-support
    subset and does not generalize to unmatched Phase II firms.
  - Exact UEI matching misses acquisitions, successors, and UEI changes.
  - An uncoded lineage proxy is not proof of a statutory Phase III award.
