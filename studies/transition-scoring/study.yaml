identity_policy:
  strategy: >-
    exact vendor identifiers first (UEI, then CAGE, then DUNS), with fuzzy company-name
    fallback gated by the thresholds in config/transition/detection.yaml
  version: config/transition/detection.yaml fuzzy_threshold 0.90 / secondary 0.80
  negative_evidence_allowed: false
materialization:
  allowed: true
  blockers: []
permitted_claims:
  - Given a fixed detection configuration and the frozen, hash-validated fusion
    coefficients, transition scoring is deterministic for a fixed input data cut.
  - Transition-scoring changes are required to maintain the repository's >=85%
    precision benchmark; this is an enforced change-gate, not a measured result
    recorded by this study.
  - The notice-corpus fusion refit reproduced the published award-grain linkage
    result on its frozen corpus (828 rows, 138 positives, 101 firms; frame hash
    4c4064f0...) with leakage-scrubbed AUC 0.847 [0.792, 0.898], inside the
    published CI [0.800, 0.886]; the held-out precision@1 analogue is the
    refit ladder's out-of-fold top1 = 0.674 (GroupKFold by firm).
limitations:
  - No stored benchmark report ties the >=85% precision target to a declared data
    cut or ground-truth label set; when it was last measured, against what labels,
    remains an open question in docs/steering/ml-methodology-review.md.
  - Recall is unknown; no estimate of missed transitions exists at any tier.
  - Composite scoring weights are hand-set expert judgment in
    config/transition/detection.yaml, not learned or validated coefficients. That
    configuration stays tunable, so the values are identified by digest rather
    than frozen. Config.scoring_digest hashes the to_detector_config surface, and
    a result is only comparable to another result carrying the same digest.
    The digest at the time of writing is
    779cf5bc662997c83da3080b747372b9556821c0f23bd0d3362606c3fba15009, enforced by
    tests/unit/transition/test_scoring_config_digest.py. A weight change moves
    the digest and fails that test, which is the intended signal; it does not by
    itself invalidate any recorded result, but a result measured under a
    different digest is a different measurement.
  - The frozen fusion coefficients apply to notice-to-award ranking, a different
    subsystem from the composite TransitionScorer; the 0.674 held-out top-1 figure
    does not transfer to composite scores, and the fusion label set is small
    (138 award-grain positives across 101 firms).
  - >-
    The fusion corpus parquet is local-only and gitignored. Its bytes are not
    SHA-enforced, and against a live archive they could not be: the GSA
    extracts are updated by their publisher. What is enforced instead is the
    reproduction contract below. The corpus was rebuilt from committed scripts
    on 2026-09-13 and reproduced the frozen 828 rows, 138 positives, and 101
    firms exactly, against the retrieval manifest pinned in frozen_artifacts.
  - >-
    The 2026-08-01 materialization has no retained retrieval manifest, so no
    rebuild can be compared against that original pull. The first comparable
    baseline is the 2026-09-13 retrieval. An earlier incomplete pull the same
    day produced 822 rows and 137 positives and was initially read as archive
    drift; it was a truncated fetch, and the rows_scanned measure is what
    distinguishes the two.
  - phase3-match-benchmark results remain provisional portfolio-linkage evidence,
    with empirical reruns blocked on required inputs that are absent from this
    repository (specs/phase3-match-benchmark/provisional-results.json).
  - Exact-identifier vendor matching misses acquisitions, successors, and UEI
    changes; fuzzy fallback introduces unadjudicated match error.
  - >-
    This study is exploratory; its scores and counts are non-citable, anything
    that leaves the repository must emit `citable: false` metadata, and no
    research question may be marked answerable on these numbers until the study
    reaches validated status.

reproduction:
  live_sources:
    - name: GSA Contract Opportunities archived-notice extracts
      retrieval_manifest: specs/phase3-notice-corpus-fusion/retrieval.2026-09-13.json
      upstream_measure: rows_scanned
      identity_grain: notice_id
  tolerances:
    - quantity: rows_scanned
      absolute_band: 10000
      derivation: >-
        Ten fiscal-year extracts totalling 3,897,224 scanned rows. A band of
        10,000 is about 0.26 percent of that total and roughly 2.5 percent of
        the smallest single year, which admits ordinary archive revision while
        refusing a truncated fetch. Derived from an observed failure rather than
        chosen: an incomplete pull on 2026-09-13 scanned 242,161 FY2022 rows
        where a complete one scanned 351,131, and a band of 10,000 rejects that
        difference by an order of magnitude.
    - quantity: positives
      absolute_band: 2
      derivation: >-
        138 award-grain positives are recovered by citation extraction from
        notice text. A revised or withdrawn notice removes at most one positive
        each, and no more than two have ever been observed to move between
        pulls. A band of 2 admits that and refuses the 18-versus-19 FY2022 swing
        that accompanied the truncated fetch, which the rows_scanned band
        catches first in any case.
