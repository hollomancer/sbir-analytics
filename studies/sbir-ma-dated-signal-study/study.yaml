schema_version: 1
study_id: sbir-ma-dated-signal-study
title: Prospective SBIR M&A dated signal study (planned cutoff 2026-08-29 UTC)
evidence_status: exploratory
research_questions:
  - F1
estimand: >-
  No numerical output is currently authorized. Amendment 4 accepts one pinned
  SBIR.gov object as a retrieval-defined private source cut: eligible source
  rows have a nonblank Company and Proposal Award Date on or before
  2026-08-29T23:59:59Z. This is not a complete as-of firm universe or a
  denominator for prevalence or exit rates. A future amendment must declare any
  observed-signal quantity, reviewed identity policy, outcome-source coverage,
  and failure modes before acquisition or aggregation. It must not reuse or
  reproduce the unrecoverable April 2026 result.
