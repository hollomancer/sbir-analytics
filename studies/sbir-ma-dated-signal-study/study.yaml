identity_policy:
  strategy: >-
    No identity resolution is authorized. A later approved run must retain raw
    source identifiers, aliases, and candidate-match rationale; normalized names
    may generate candidates but cannot establish a firm, acquisition, or exit.
  version: retrieval-defined-selection-2026-08-29-v1
  negative_evidence_allowed: false
materialization:
  allowed: false
  blockers:
    - >-
      Amendment 4 accepts the pinned SBIR.gov object only as a retrieval-defined
      source-row selection, not an as-of firm universe. Source/privacy/license/
      release-scope review, identity review, a declared numerical output, and
      human validation remain unapproved; materialization stays closed.
      Amendment 7 authorizes only accession-grain observation of the Form D
      business-combination source field. It does not authorize an event,
      identity resolution, aggregation, or result.
permitted_claims:
  - >-
    This is a new exploratory, unmaterialized protocol with a fixed 2026-08-29
    UTC source-row selection cutoff in one pinned provider object.
  - >-
    The unrecoverable April 2026 analysis is not reproduced, validated, or used
    as an input or benchmark by this study.
limitations:
  - >-
    The official SBIR.gov CSV was acquired privately and is accepted only as a
    retrieval-defined source-row selection. It has no complete as-of coverage,
    reviewed firm identity, observed event population, denominator, or numerical
    result.
  - >-
    Exploratory status is non-citable and does not authorize a Computable,
    Validated, or Citable inventory status or any external numerical claim.
  - >-
    A signal is not an acquisition, exit, rate, survival outcome, agency effect,
    comparator result, or causal finding without a separately frozen and
    validated evidence-tier design.
