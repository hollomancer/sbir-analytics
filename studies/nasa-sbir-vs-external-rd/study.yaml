schema_version: 1
study_id: nasa-sbir-vs-external-rd
title: NASA SBIR versus other external research and development
evidence_status: exploratory
research_questions: [B3, C3, D3]
estimand: >-
  For NASA projects with overlapping topic, center, technology readiness level,
  start year, size, duration, geography, performer type, and pre-award outcomes,
  estimate adjusted differences between SBIR and other external research in
  mission adoption, procurement, operating status, licensing, non-SBIR revenue,
  productivity, capital, exits, and knowledge outputs. Without an exogenous
  allocation rule, the estimand is matched observational.
frozen_artifacts:
  - path: studies/nasa-sbir-vs-external-rd/design.md
    sha256: 3aebaa7a9b7585bd0a2d68bb4e9e9eb4669b6e43e512c989985deecd62b00328
  - path: studies/sbir-roi-comparative-tests/contracts.yaml
    sha256: e880d2149b1f314585da32ccd6f0890f8c820504c05d04b3bc1ed5f8d97f006b
implementation:
  - path: scripts/research/sbir_roi_contracts.py
    symbol: NASA_COMPARATOR_STUDY
  - path: scripts/research/sbir_roi_contracts.py
    symbol: validate_registry_bundle
identity_policy:
  strategy: >-
    Preserve NASA project, award, solicitation, and performer identifiers.
    Resolve firms through a versioned policy. Require dated source links for
    procurement, licenses, financing, exits, and operating status.
  version: planned-nasa-project-v1
  negative_evidence_allowed: false
materialization:
  allowed: false
  blockers:
    - No pinned NASA-wide external research universe exists in the repository.
    - Technology readiness, performer type, and pre-outcome coverage are not audited.
    - Mission-adoption and licensing sources are not frozen.
permitted_claims:
  - This manifest defines Test Two for NASA and authorizes no numerical result.
  - A matched first run must remain descriptive or relational evidence.
limitations:
  - NASA external awards include mechanisms that are not interchangeable.
  - Mission adoption can occur without a visible procurement record.
  - Matching cannot remove unobserved project quality or program-manager selection.
  - Exploratory status is non-citable.
