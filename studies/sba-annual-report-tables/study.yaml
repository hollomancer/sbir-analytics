schema_version: 1
study_id: sba-annual-report-tables
title: SBA SBIR/STTR annual-report state tables, FY2020-FY2022
evidence_status: reproducible
research_questions:
  - A1
  - D1
estimand: >-
  For report-years FY2020-FY2022, recompute the published "SBIR/STTR Awards by
  U.S. State and Territory" tables from a pinned SBIR.gov award export and
  measure the deviation of recomputed award counts from the published counts,
  per jurisdiction x program x phase cell and in total, against a stated
  tolerance contract, classifying every cell into one frozen difference class.
  This is the labelled structural check design.md permits when no report-era
  vintage exists, not a published-sample replication. Not an estimate of program
  activity, not a corrected version of the published tables, and not a causal or
  welfare quantity. It establishes whether the published counts are recoverable
  from the current database within a declared band; it does not establish what
  the counts were at publication, which is unrecoverable, and the published-
  sample outcome stays blocked.
