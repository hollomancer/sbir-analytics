schema_version: 1

# Capture manifest for Study 1 (SBA SBIR/STTR annual-report tables, [L18]).
#
# STATUS: the start gate IS satisfied as of 2026-09-17 — the FY20/FY21/FY22 reports
# are pinned and all nine required definitions are accounted for. They are NOT
# accounted for at equal evidence levels; see definition_decisions.evidence_ladder
# before quoting any of them. No definition is paraphrased here: `definition_verbatim`
# points only at a record of verbatim quotes, and is null for a report year whose text
# does not state the rules.

capture_status: partial  # FY20/FY21/FY22 state tables captured
gate_satisfied: true   # all nine definitions accounted for; see definition_decisions.evidence_ladder

# Maintainer decision 2026-09-17: the exact-vintage constraint is relaxed for bulk
# upstream sources such as SBIR.gov, which publish only a current snapshot.
#
# The outcome vocabulary frozen in design.md is `reproduced` / `diverged with
# explanation` / `blocked`, and design.md already settled this case in advance: with
# no report-era vintage the published-sample outcome is `blocked`, and a comparison
# against the current snapshot is admissible only when labelled a structural check.
# The verdict below therefore stays `blocked` and is not a run result. The method
# field records how comparison proceeds anyway; passing its bands does not promote
# the outcome. An earlier revision of this file set the verdict to
# `vintage_tolerant_reproduction`, which was not one of the frozen values.
published_sample_verdict: blocked
published_sample_method: vintage_tolerant_structural_check
exact_vintage_reproduction: impossible_no_surviving_vintage
published_sample_verdict_evidence: studies/sba-annual-report-tables/vintage-drift-2026-09-17.md

# The nine definitions design.md requires verbatim before comparison. Named here so
# capture is checkable against a list rather than a scalar per report.
definitions_required:
  - fiscal_year_rule
  - dollar_basis
  - sttr_treatment
  - phase_label_rollup
  - agency_attribution
  - amendment_handling
  - first_time_winner_lookback
  - zero_dollar_records
  - state_attribution

# Deliverables the study must reproduce. Applies to every report-year the selection
# rule can choose, not only FY22 — it was previously stated on the FY22 target alone,
# which left two valid selections without a required table set.
tables_needed:
  - award dollars and counts by agency
  - award dollars and counts by state
  - award dollars and counts by phase
  - award dollars and counts by fiscal year
  - first-time-winner counts and shares

# Where those deliverables are read from in the source PDFs. The table NUMBER differs
# by report-year, verified against each report's own caption, so a replication must
# not key on a fixed number.
source_tables_to_extract:
  - name: Awards by U.S. State and Territory
    numbered: {FY22: "Table 20", FY21: "Table 18", FY20: "Table 18"}
  - name: Distribution of total SBIR/STTR dollars obligated by agency
    numbered: {FY22: "Charts 1 and 2"}
  - name: Agency submission date and days early or late
    numbered: {FY22: "unnumbered, p9-10", FY21: "unnumbered, p9-10", FY20: "unnumbered, p9-10"}
  - name: First-time-winner share
    numbered: {FY22: "narrative, p47-48"}

selection_rule: >-
  Select the most recent annual report whose underlying source export can be
  recovered. Recoverability governs, not recency. Record the chosen report and the
  reason here once capture succeeds.

