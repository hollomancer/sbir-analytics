# ---------------------------------------------------------------------------
# Proposed StudyManifest.reproduction contract, to be lifted into study.yaml when
# the implementation lands. Bands derive from drift measured over a single
# 4.2-month window (vintage-drift-2026-09-17.md). Extrapolating them across the
# multi-year gap to the [L18] reports is an assumption, not a measurement.
#
# Scope: this contract classifies drift of the INPUT between pinned vintages via
# sbir_etl.quality.reproduction.classify_rebuild. It never grades agreement
# between a recomputed cell and a published cell. Cell differences are classified
# one at a time under design.md's four classes, and `revised_upstream` requires
# record-level evidence (the underlying award rows differ between pinned
# vintages), not residence inside any band here.
# ---------------------------------------------------------------------------
proposed_reproduction_contract:
  live_sources:
    - name: SBIR.gov award export (mod_awarddatapublic)
      # Tracked copy; the download itself stays gitignored under /data/*. When
      # lifted into study.yaml, list this tracked file in frozen_artifacts.
      retrieval_manifest: studies/sba-annual-report-tables/data/award_data-2026-09-17.meta.json
      retrieval_manifest_untracked_original: data/raw/sbir/history/2026-09-17/award_data.meta.json
      upstream_measure: total record count in the export
      # Identity is declared at the matched-award key the drift measurement used
      # (agency tracking number, contract, company, award year), not at the raw
      # export row: rows churn in place (135 removed / 136 added over 4.2
      # months), so per-row identity would return IDENTITY_DIVERGENCE on every
      # rebuild and the contract would never reach its bands.
      identity_grain: >-
        unique award keyed by agency tracking number, contract, company, and
        award year, within FY2020-FY2022
  tolerances:
    - quantity: total record count in the export
      absolute_band: 500
      derivation: >-
        The upstream_measure needs its own band or classify_rebuild returns
        OUTSIDE_TOLERANCE ("no declared tolerance") whenever the export grows.
        Observed accretion was +89 records over 4.2 months; 500 covers a year of
        ordinary accretion at that rate with headroom.
    - quantity: FY2020-FY2022 total award dollars (USD)
      absolute_band: 30000000
      derivation: >-
        Measured movement over 4.2 months was +$5,669,026 (+0.0465%) on a
        $12.2040B base, and the largest single award-amount correction observed was
        $1,928,322. The band is $30M, about 0.25% of the total and roughly five
        times the observed four-month move, leaving room for accumulation across a
        multi-year gap and several large corrections. It is deliberately not
        time-scaled from a single observation window.
    - quantity: FY2020-FY2022 unique award count
      absolute_band: 200
      derivation: >-
        Over 4.2 months, 135 window records were removed and 136 added, for a net
        change of +1 unique award at the declared identity grain. The band covers
        observed churn with headroom.
    - quantity: FY2020-FY2022 records whose state attribution differs from the pinned vintage
      absolute_band: 150
      derivation: >-
        32 state re-attributions were measured over 4.2 months (0.16% of matched
        records). Compare like endpoints only: the legacy feed reports states as
        USPS abbreviations, which makes an unnormalised comparison report 100%.
  # The estimand's cell grid (agency x state x phase x fiscal-year x
  # first-time-winner) is deliberately not banded. A cell-level difference is
  # never absorbed by a tolerance: it is classified under design.md
  # (rounding / revised_upstream / definition_mismatch / pipeline_defect),
  # with revised_upstream demonstrated from the specific records that moved.
