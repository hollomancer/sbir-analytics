    size_bytes: 394410138
    retrieved_on: "2026-05-11"
    source_url: https://data.www.sbir.gov/mod_awarddatapublic/award_data.csv
    source_url_evidence: inferred_from_schema
    source_url_caveat: >-
      The URL was not recorded at retrieval, so the hash and date do not by
      themselves prove which endpoint produced this file. It is inferred: this
      export carries 42 columns including UEI, matching the mod_awarddatapublic
      product, whereas the legacy data.www.sbir.gov/awarddatapublic/ endpoint on
