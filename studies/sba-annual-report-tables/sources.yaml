# Capture manifest for Study 1 (SBA SBIR/STTR annual-report tables, [L18]).
#
# STATUS: the roadmap's start gate for this study — "exact table definitions and
# report-year source files captured" — is NOT yet satisfied. This file records what
# must be captured, what is already pinned, and what is blocked. No definition is
# paraphrased here: `definition_verbatim` stays null until the report text is in hand.

capture_status: partial  # FY20/FY21/FY22 state tables captured
gate_satisfied: false  # blocking on ONE item: amendment/modification handling

# Maintainer decision 2026-09-17: the exact-vintage constraint is relaxed for bulk
# upstream sources such as SBIR.gov, which publish only a current snapshot. Exact
# published-sample reproduction is impossible (no report-era vintage survives), and
# is replaced by a vintage-tolerant reproduction with declared bands via the
# StudyManifest.reproduction contract. Bands derived in vintage-drift-2026-09-17.md
# from measured drift of +0.047% over 4.2 months.
published_sample_verdict: vintage_tolerant_reproduction
exact_vintage_reproduction: impossible_no_surviving_vintage
published_sample_verdict_evidence: studies/sba-annual-report-tables/vintage-drift-2026-09-17.md

selection_rule: >-
  Select the most recent annual report whose underlying source export can be
  recovered. Recoverability governs, not recency. Record the chosen report and the
  reason here once capture succeeds.

