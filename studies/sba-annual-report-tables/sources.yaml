# Cross-year findings in cross-year-fy20-fy22.md. Three notes bear on the contract:
#  - the +/-$1 total-column residual recurs in all three years, so it is a per-cell
#    allowance the contract should carry separately from the vintage bands;
#  - the jurisdiction set is not constant (53 rows in FY20/FY21, 52 in FY22: MH);
#  - the Phase I+II shortfall against program totals moves a lot by year
#    (-2.95%, -2.67%, -7.31% on SBIR), so a Table 20 panel is not
#    a program-obligations panel and the wedge between them must not be ignored.

# Table 20 does not sum to the program totals, by design rather than by error:
# it covers Phase I and Phase II awards while the program totals cover all
# obligations. Shortfall -300,924,559 SBIR (-7.31%) and
# -4,040,026 STTR (-0.65%). Do not reconcile the two.

# ---------------------------------------------------------------------------
# Decisions for the four definitions absent from every source year.
# Full basis and measurements: studies/sba-annual-report-tables/definition-decisions.md
# ---------------------------------------------------------------------------
definition_decisions:
  record: studies/sba-annual-report-tables/definition-decisions.md
  measured_against: data/raw/sbir/history/2026-09-17/award_data.csv   # mod_awarddatapublic endpoint
  window: FY2020-FY2022
  rows_measured: 20836
  closed: 4
  open: 0
  # How each of the nine required definitions is satisfied, and at what evidence
  # level. These are NOT equivalent; do not describe an inferred rule as recovered.
  evidence_ladder:
    recovered_verbatim: [fiscal_year_rule, dollar_basis, sttr_treatment]
    recovered_from_source_methodology: [amendment_handling]
    partial_with_documented_limits: [phase_label_rollup, agency_attribution]
    inferred_by_reproducing_published_figure: [first_time_winner_lookback]
    closed_as_not_applicable: [zero_dollar_records]
    closed_as_tolerance: [state_attribution]
  caveats:
    fiscal_year_rule: >-
      FY2016 p39 records that SBA cannot distinguish obligation year from
      appropriation year for DoD and would like to report both. The recovered rule
      stands, but for the largest agency the obligation-year basis is not cleanly
      separable.

  amendments_modifications:
    status: closed
    closed_how: recovered_from_source      # SBA's own methodology statement, FY2016 p39
    record: studies/sba-annual-report-tables/assembly-methodology.md
    finding: >-
      There is no amendment-counting rule to recover. SBA states the report tables
      are "a summation of the individual awards uploaded to SBA", explicitly so the
      report matches SBIR.gov. Post-publication corrections are pushed to the
      database and the published report is not revised (FY2016 p39), so the surplus
      is a vintage phenomenon rather than a definitional one.
    blocking: false
    decides_share_of_published_counts: "0.36%-1.99%"
    evidence:
      export_rows_exceed_published: {fy2020: 180, fy2021: 98, fy2022: 56}
      duplicate_award_keys: {fy2020: 38, fy2021: 44, fy2022: 32}
      residual_after_dedup: {fy2020: 142, fy2021: 54, fy2022: 24}
      rows_outside_published_jurisdictions: 1
    reframed_as: vintage_tolerance          # see published_table_tolerances below
    supporting_measurements:
      distinct_contract_phase_exceeds_published: {fy2020: 144, fy2021: 81, fy2022: 45}
      tracking_number_dedup_undershoots: {fy2020: -42, fy2021: -105, fy2022: -123}
      contract_is_project_not_award: >-
        421 duplicate-contract groups: 89.5% differ in amount, 19.5% stay within one
        phase, 67.5% span >1 award year; DOE is 703 of 853 rows (82%).
      dod_submission_days_late: {fy2020: 150, fy2021: 149, fy2022: 0}
      extraction_caution: >-
        The FY20/FY21 submission tables print 1501 and 1491 in the days column.
        Those are 150 and 149 with a footnote marker flattened into the digits by
        text extraction; verified against the stated 03/15 deadlines. Do not read
        those cells literally.
    unresolvable: >-
      The publication-era figure cannot be reconstructed. SBIR.gov serves only the
      current snapshot, so no report-era export survives to compare against.

  first_time_winner_lookback:
    status: closed
    closed_how: empirical_recovery   # inferred by reproducing the published statistic, NOT read from source
    epistemic_status: weaker than a verbatim definition; do not describe as recovered from the source
    basis: distinct_awardee_firms          # awards basis yields 28.2%; published figure is 39%
    window: all_program_history            # 5-year window yields 40.2%-43.2%
    identity_key: uei_with_normalized_name_fallback
    name_profile: ENTITY_RESOLUTION_V1     # sbir_etl.identity.company_names, imported not reimplemented
    prior_means: any_prior_sbir_or_sttr_award   # requires sign-off; prior-Phase-I-only yields 39.39%
    recomputed_fy22_rate: 0.3865
    published_fy22_rate: 0.39
    distinct_firms: 2559
    cross_validation: impossible           # FY2020 and FY2021 publish no comparable statistic

  zero_dollar_records:
    status: closed
    decision: not_applicable_in_scope
    evidence: 0 of 20836 FY20-FY22 export rows have award amount <= 0 or missing
    revisit_if: panel extends beyond FY2020-FY2022

  state_attribution:
    status: closed
    decision: tolerance_not_rule           # award-time address is unrecoverable from this export
    use: export current State value, mapped from full name to USPS code
    four_month_drift: {state: 0.00155, city: 0.01200, zip: 0.01637, address1: 0.02230}
    drift_is_a_floor: true                 # FY22 published 2023; band must reflect elapsed time
    do_not_go_finer_than_state: true       # zip drifts 11x as often as state over the same interval

next_actions:
  # DONE 2026-09-17: scripts/data/sba_annual_report_tables.py, results/ committed.
  # Structural check passes in all three years; published-sample outcome stays blocked.
  - Sign off on first_time_winner_lookback.prior_means (any prior award vs prior
    Phase I only). Both reproduce the published 39%; the choice moves the recomputed
    rate by 0.74pp and nothing else.
  - Resolve the Phase IIB / sequential Phase II rollup into the published Phase II
    column, and the DoD component-to-department aggregation.
  - Quantify the dollar mechanism. The published-versus-recomputed dollar delta
    reverses sign across report-years (+1.875%, -1.314%, +1.322%), which accretion
    cannot explain, so no dollar band is committed and the materialization gate is
    closed on it. Decide whether it is a few large revisions or broad drift.

# ---------------------------------------------------------------------------
# SUPERSEDED 2026-09-17, retained as the derivation record. study.yaml now carries
# the live StudyManifest.reproduction contract, and it is deliberately narrower than
# this block: StudyManifest.reproduction and classify_rebuild compare a pinned
# retrieval against a later fetch of the SAME live source, so only a quantity named
# as upstream_measure belongs there. The published-cell bands live in
# published_table_tolerances below and are governed by design.md's four difference
# classes, not by this contract. Note also that at the declared identity grain the
# export does not preserve rows across vintages (135 out, 136 in over 4.2 months),
# so a rebuild returns identity_divergence before any band here is read.
# Bands below derive from a single 4.2-month window (vintage-drift-2026-09-17.md);
# extrapolating them across the multi-year gap to the [L18] reports is an
# assumption, not a measurement.
# ---------------------------------------------------------------------------
proposed_reproduction_contract:
  live_sources:
    - name: SBIR.gov award export (mod_awarddatapublic)
      retrieval_manifest: data/raw/sbir/history/2026-09-17/award_data.meta.json
      upstream_measure: total record count in the export
      identity_grain: one row per award action as published by SBIR.gov
  tolerances:
    - quantity: FY2020-FY2022 total award dollars (USD)
      absolute_band: 30000000
      derivation: >-
        Measured movement over 4.2 months was +$5,669,026 (+0.0465%) on a
        $12.2040B base, and the largest single award-amount correction observed was
        $1,928,322. The band is $30M, about 0.25% of the total and roughly five
        times the observed four-month move, leaving room for accumulation across a
        multi-year gap and several large corrections. It is deliberately not
        time-scaled from a single observation window.
    - quantity: FY2020-FY2022 unique award count
      absolute_band: 200
      derivation: >-
        Over 4.2 months, 135 window records were removed and 136 added, for a net
        change of +1 unique award. The band covers observed churn with headroom.
    - quantity: FY2020-FY2022 records whose state attribution differs from the pinned vintage
      absolute_band: 150
      derivation: >-
        32 state re-attributions were measured over 4.2 months (0.16% of matched
        records). Compare like endpoints only: the legacy feed reports states as
        USPS abbreviations, which makes an unnormalised comparison report 100%.

# Tolerances for reproducing the PUBLISHED tables from the export. Distinct from
# `tolerances` above, which covers vintage drift between two exports. Basis:
# 569 published cells (state x program x phase) across FY2020-FY2022, compared
# against the pinned 2026-09-17 export. Full derivation in assembly-methodology.md.
published_table_tolerances:
  - quantity: per-row residual between a published total column and the sum of its published parts
    band: "$1"
    derivation: >-
      Not an agreement band between published and recomputed values: this is an
      allowance on the published table's own internal arithmetic, checked before any
      comparison because design.md makes denominator integrity blocking. Measured
      across FY2020-FY2022: 38 row-identity residuals, every one at most $1 —
      all_tot=sbir+sttr on 22 rows (4 FY20, 4 FY21, 14 FY22), sbir_tot=p1+p2 on 15
      (6 FY20, 9 FY21), sttr_tot=p1+p2 on 1 (FY21). All three award-count identities
      hold exactly in all three years. Consistent with the source summing amounts
      carrying cents and printing whole dollars. A residual above $1 is a capture
      defect and raises. Implemented as verify_published_identities().
  - quantity: total award count, per report-year
    band: "+3% one-sided"
    derivation: >-
      Observed export surplus over published: +0.85% (FY2022), +1.44% (FY2021),
      +2.51% (FY2020). One-sided because post-publication correction only adds
      records; the export should never fall below the published count. The band
      covers the observed maximum with headroom and is not time-scaled from three
      observations.
  - quantity: per-cell award count (state x program x phase)
    band: "max(6 rows, 20%)"
    derivation: >-
      Tightest band on the tested grid covering 100% of 569 cells;
      max(4 rows, 20%) covers 99.82%. A hybrid is required because small cells move
      little in absolute terms but up to 100% relatively, while large cells move up
      to 6 rows but only 6% relatively. Largest single deviation: FY2020 CA SBIR
      Phase II, 466 published against 489 in the export (+23, +4.9%).
    warning: >-
      This band absorbs TWO superimposed effects and must not be read as a count
      tolerance alone. Only 41.5-46.6% of cells match exactly and cells run under as
      often as over (FY2022: 62 over, 49 under, net +56). The under-cells are firm
      relocation, i.e. the state-attribution tolerance: FL +16, CO +15, NC +12,
      TX +8 gaining against PA -7, DE -7, VA -6, WA -5 losing. At least 83-97 rows
      per year sit in the wrong cell. Validate totals against the count band and
      cells against the combined band; never attribute cell displacement to counting.
