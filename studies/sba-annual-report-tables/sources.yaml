schema_version: 1

# Capture manifest for Study 1 (SBA SBIR/STTR annual-report tables, [L18]).
#
# STATUS: report-year source files are captured (FY20-FY22, hashes below) and the
# FY22 definitions are extracted to definitions-fy22.md. The roadmap's start gate
# is still NOT satisfied: four of the nine required definitions are not stated in
# the source and need documented decisions in amendments.md before comparison.

capture_status: partial
gate_satisfied: false  # 4 of 9 required definitions are not stated in the source

# Maintainer decision 2026-09-17: the exact-vintage constraint is relaxed for bulk
# upstream sources such as SBIR.gov, which publish only a current snapshot. No
# report-era vintage survives, so the exact-vintage published-sample outcome is
# `blocked` (design.md, source-vintage risk). What proceeds instead is the labelled
# structural check design.md permits: recompute against a *pinned* later vintage
# under the StudyManifest.reproduction drift contract. The method field below names
# that choice; the verdict field carries the design.md outcome vocabulary only.
published_sample_method: vintage_tolerant_structural_check
published_sample_verdict: blocked  # no report-era vintage survives; not a run result
exact_vintage_reproduction: impossible_no_surviving_vintage
published_sample_method_evidence: studies/sba-annual-report-tables/vintage-drift-2026-09-17.md

selection_rule: >-
  Select the most recent annual report whose underlying source export can be
  recovered. Recoverability governs, not recency. Record the chosen report and the
  reason here once capture succeeds.

# The published table set to reproduce. It applies to whichever report-year the
# selection rule chooses, so it lives here rather than on any single target.
tables_needed:
  - award dollars and counts by agency
  - award dollars and counts by state
  - award dollars and counts by phase
  - award dollars and counts by fiscal year
  - first-time-winner counts and shares

