    sha256: aed146eab56f370c9f3fe7f562475e3eedfc61cca2eba112c830fac6f73bf38a
    size_bytes: 394636989
    source_url: https://data.www.sbir.gov/mod_awarddatapublic/award_data.csv
    retrieved_on: "2026-09-17"
    evidence_class: administrative_record
    identity_grain: one row per award action as published by SBIR.gov
    columns: 42
    schema_matches_2026_05_11: true
    role: pinned_comparison_vintage
    endpoint_caution: >-
      Pin this exact URL. The same host also serves
      data.www.sbir.gov/awarddatapublic/award_data.csv (no mod_ prefix), a legacy
