permitted_claims:
  - Given the frozen design, committed NIH tables, and assumptions YAML, the
    mechanism-year metrics and break-even hours are deterministic.
  - The NIH comparison is a break-even and sensitivity result over declared
    hour and duration assumptions, not a directional efficiency ranking.
  - Anything that leaves the repository must be labeled non-citable.
limitations:
  - Applicant and reviewer hours are assumed, not observed for SBIR firms.
  - FDP Faculty Workload Survey hours describe university PIs, not small
    businesses; transferring them is an assumption.
  - Duration convention (annual R01 size versus multi-year project total)
    moves the ranking.
  - Agency selection cost is missing; the 3% SBIR administrative-funding
    allowance is a statutory ceiling on extra admin, not total cost.
  - Success-rate denominators follow NIH competing-application rules and are
    not NSF funding rates.
  - Applicant hours are modelled as one grid per mechanism, but the applicant
    population is bimodal. SBA reports that 68 firms, 1.4% of companies winning
    a Phase II in FY17–FY21, took 20% of Phase II awards, and that 2% of FY22
    Phase I awardees took 14% of Phase I awards. Marginal proposal hours for
    serial filers and first-time applicants are unlikely to share one
    distribution, so a single grid understates dispersion.
  - Reviewer hours per application are now anchored by one published US survey
    (AIBS, Gallo 2019) rather than being wholly assumed, but that survey
    measures panel review of NIH-style applications and reports pre-meeting
    time separately from meeting and travel time.
  - This study is reproducible, not validated or citable.
