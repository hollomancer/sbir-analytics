schema_version: 1
study_id: allocation-transaction-costs
title: NIH SBIR/STTR versus R01-equivalent allocation transaction costs
evidence_status: reproducible
research_questions:
  - C4
estimand: >-
  Among NIH competing applications in overlapping fiscal years, estimate
  transaction hours per funded award, transaction dollars per funded award,
  and transaction cost per dollar awarded for NIH SBIR/STTR phases versus
  NIH R01-equivalent grants under declared duration conventions and hour
  assumptions, plus the break-even SBIR applicant-hour threshold at which
  cost per awarded dollar equals. Not a welfare estimate, not a quality
  measure, and not a causal effect of offering SBIR instead of R01s.
