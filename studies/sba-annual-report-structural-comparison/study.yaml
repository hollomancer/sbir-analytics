identity_policy:
  strategy: >-
    Match report year, two-letter jurisdiction, program, and phase exactly after
    applying the study-only frozen jurisdiction profile. That profile accepts
    only 53 exact, case-sensitive, untrimmed full names. Blank State rows are
    excluded and counted; every other unmapped nonblank State blocks the run.
    Marshall Islands maps to MH only in this profile; MH is outside the general
    canonical jurisdiction set.
  version: export-row-award-year-v1
  negative_evidence_allowed: false
materialization:
  allowed: false
  blockers:
    - >-
      Release governance requires explicit owner approval before merge, an
      immutable annotated version 0.18.0 tag, tag-bound citation metadata, and
      a citable-promotion evidence audit. Every claim-facing revision also
      requires an evidence audit and a cold named-reader review of its exact bytes.
permitted_claims:
  - >-
    Validated, not citable: for all 632 award-count cells printed in FY2020
    Table 18, FY2021 Table 18, and FY2022 Table 20, this study reports the
    differences between those published counts and counts computed from the
    pinned September 17, 2026 SBIR.gov export under EXPORT_ROW_V1,
    AWARD_YEAR_FIELD_V1, and the frozen program, phase, and jurisdiction rules.
    A separate blinded-role implementation reproduced 1,264 of 1,264 count
    operands. The recorded interval is [1.0, 1.0] using the method: exact
    complete-population point interval; no sampling. This statement is not
    citable until the product-scoped materialization and tagged-release gates open.
  - >-
    The comparison contains 632 count cells: 276 are exact and 356 are
    unresolved. Recomputed minus published counts sum to +333, while absolute
    cell differences sum to 869. Of the 276 exact cells, 57 are zero versus
    zero. Among the 575 cells where either source reports a nonzero count, 219
    are exact. The unresolved cells comprise 208 positive and 148 negative
    recomputed-minus-published differences. These summaries are not an
    omitted-award estimate, a source-correctness verdict, or a causal explanation.
limitations:
  - The study does not reproduce the unavailable publication-era SBIR.gov export.
  - The study does not certify SBIR.gov or the SBA annual reports as complete or correct.
  - The study does not establish official-report equivalence.
  - The study does not compare or validate award-dollar totals.
  - The study does not measure commercialization, program effects, or economic return.
  - The study does not validate M&A, private-capital, or other repository outputs.
  - The validation does not detect a rule error shared by both separate implementations.
  - Independence is between named blinded roles and separate implementations in this repository; it is not an unaffiliated third-party replication.
validation_design:
  addressable_population: >-
    All 1,264 count operands underlying the 632 printed and export-derived cells
    in FY2020 Table 18, FY2021 Table 18, and FY2022 Table 20.
  expected_yield: >-
    1,264 independently extracted values if all source pages and export rows are readable.
  decision_threshold: >-
    The first sealed independent extraction must equal every one of the 1,264
    frozen production values.
  threshold_derivation: >-
    This is a complete deterministic reconciliation. One changed operand changes
    a released comparison cell and therefore fails the fidelity claim.
  threshold_basis: count_on_frozen_population
  threshold_value: 1264
  frozen_population_artifact: studies/sba-annual-report-structural-comparison/validation-population-v1.csv
