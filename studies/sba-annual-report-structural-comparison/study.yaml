estimand: >-
  For all 632 award-count cells printed in FY2020 Table 18, FY2021 Table 18,
  and FY2022 Table 20, the signed and absolute differences between the printed
  counts and counts computed from the exact September 17, 2026 SBIR.gov export
  under EXPORT_ROW_V1, AWARD_YEAR_FIELD_V1, and the frozen jurisdiction rules.
