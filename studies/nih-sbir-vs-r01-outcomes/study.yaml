schema_version: 1
study_id: nih-sbir-vs-r01-outcomes
title: NIH SBIR versus R01 multidimensional outcomes
evidence_status: exploratory
research_questions: [C3, D3]
estimand: >-
  For NIH SBIR and R01 portfolios with overlapping institute, topic, start year,
  research stage, and observation windows, estimate adjusted differences in a
  declared outcome vector per lifecycle federal dollar. The vector includes
  operating-firm survival, private capital, licensing, approvals, clinical use,
  revenue, productivity, publications, and patents. It is not a causal effect
  of assigning funds to firms instead of universities.
