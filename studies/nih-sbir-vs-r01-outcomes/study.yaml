    symbol: NIH_COMPARATOR_STUDY
  - path: scripts/research/sbir_roi_contracts.py
    symbol: validate_registry_bundle
identity_policy:
  strategy: >-
    Preserve award and project identifiers. Resolve organizations separately
    from people and products. Require dated, source-specific links for licenses,
    approvals, financing, and firm outcomes.
  version: planned-nih-portfolio-v1
  negative_evidence_allowed: false
materialization:
  allowed: false
  blockers:
    - The National Academies cohort has not been reproduced from pinned source inputs.
    - Lifecycle costs and outcome windows are not frozen.
    - Licensing, clinical-use, revenue, productivity, and survival coverage are incomplete.
permitted_claims:
  - This manifest defines Test Two for NIH and authorizes no comparative ranking.
  - Any first run must be labeled matched observational unless a valid assignment rule is added.
limitations:
  - SBIR and R01 jointly differ by performer, award architecture, research stage, and selection.
  - Publications favor academic production and are not a commercialization measure.
  - Private capital and exits are validation signals, not taxpayer benefits by themselves.
  - Exploratory status is non-citable.
