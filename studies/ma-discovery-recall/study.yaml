schema_version: 1
study_id: ma-discovery-recall
title: Form-D-missing M&A discovery recall (web-search confirmation)
evidence_status: exploratory
research_questions:
  - F2
  - A4
estimand: >-
  Among Form-D-missing rows in the pinned sbir_ma_events.jsonl cut that name an
  acquirer and whose existing event is not already confidence in {medium, high},
  count distinct (company, acquirer) pairs after CompanyNameProfile.RECIPIENT_V1
  that a web-search snippet extractor confirms at medium or high confidence and
  that C3 inserts or promotes, as of the run as-of date. Non-detection is not
  proof of no acquisition. The count is not an SBIR exit rate. The 200-pair
  envelope in design.md remains the failed original validation design and is
  not rewritten.
