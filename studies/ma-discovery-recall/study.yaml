identity_policy:
  strategy: >-
    Query generation, pair matching, and C3 company keys all use
    CompanyNameProfile.RECIPIENT_V1 (suffix-stripping). Empty normalization is
    a mismatch. Form D acquirers are never overwritten.
  version: recipient-v1
  negative_evidence_allowed: false
materialization:
  allowed: false
  blockers:
    - Discovery output is not wired into capital_events or any service database
    - >-
      Preregistered validation design did not pass: 200-pair recall 9<10;
      500-pair enlarge and cost restatement were post-hoc (evidence-auditor
      2026-09-02 BLOCK)
    - >-
      Held-out confirmatory 501-1500 is an exploratory record; evidence-auditor
      BLOCKED promotion because confirmatory-design.md was not shown hashed in
      git before the Brave freeze. Remaining bar is a new protocol hashed
      before any search/LLM on unseen pairs.
    - >-
      Held-out 1501-2500 did not pass (evidence-auditor 2026-09-08 BLOCK).
      Cut-level strict recall is 4 of a floor of 10, from the replay pinned in
      held-out-run-manifest.json. The capture process reported 2, which was a
      subset count over 528 of 1000 pairs and is superseded. Four independent
      defects: the frozen note carried a false provenance statement and its
      validity precondition was rewritten while 948/1000 pairs were on disk;
      the unverified_empty retry class was applied to 476 rows after they
      existed; there was no coverage gate; gate 3 was unmeasurable in code.
      The code defects are fixed in 518ef187, which does not unblock this cut.
    - >-
      The recall floor of 10 is not reachable on the remaining population. The
      strict-eligible fraction falls down file order (68 percent, 50, 31) and
      only 362 strict-eligible pairs remain unseen after pair 2500. At the
      observed strict rates (pilot 9/342, confirmatory 13/503, held-out 4/307)
      the whole remainder yields about 5 to 9 expected. A further cut under
      this design is preregistered to fail on power, not on method.
permitted_claims:
  - The method, C3 join, confidence table, and fail-closed search default are
    specified and fixture-tested.
  - >-
    On held-out cut 1501-2500 the preregistered floor of 10 strict medium/high
    pairs was not met. The replay recorded 4 strict medium/high pairs; over the
    307 strict-eligible pairs the replay itself enumerated, that is Wilson 95%
    [0.0051, 0.0330]. This is a non-citable exploratory record, not a
    confirmatory test of the method: the evaluated design was pinned after the
    run, and four provenance defects are recorded below. The 307 denominator is
    post-hoc; the preregistered gate was a count floor over the 1000-pair cut.
  - No other numerical recall, precision, or exit-rate claim is authorized, and
    no result here may leave the repository.
limitations:
  - This study is exploratory. Nothing that leaves the repository may be cited.
  - Keyword confirmation cannot emit medium/high rows because it has no date.
  - A live search or live LLM call is not a reproducible input.
  - The Brave snippet cut and frozen LLM JSONL are a private gitignored freeze;
    they are not redistributed.
  - Inventory F2/A4 remain without a Computable or Validated rank on this work.

validation_design:
  addressable_population: >-
    The 1000-pair held-out cut 1501-2500 of the pinned sbir_ma_events.jsonl
    (sha256 6ffc8481...), of which the replay enumerated 307 as strict-eligible.
  expected_yield: >-
    At least 10 distinct strict medium/high (company, acquirer) pairs recovered
    by web confirmation on rows Form D does not reach.
  decision_threshold: >-
    At least 10 strict medium/high pairs in the cut. Recorded as
    recall_floor in held-out-1501.yaml before capture.
  threshold_derivation: >-
    The floor of 10 was set in the confirmatory design as the minimum recovery
    that would make the channel worth wiring into capital_events. It is a count
    over a frozen cut, not a rate, because the eligible share was not known
    before capture -- and in the event it fell from 68 to 50 to 31 percent down
    file order, which is why the floor proved unreachable on the remaining
    population.
  threshold_basis: count_on_frozen_population
  threshold_value: 10
  frozen_population_artifact: studies/ma-discovery-recall/held-out-1501.yaml

validation_result:
  design_path: studies/ma-discovery-recall/held-out-1501.md
  design_sha256: e7090020ef22b87090496d7c93857ed84a45a0d6479cff11289f3a3f23f041ab
  evaluated_on: 2026-09-09
  metric: >-
    Strict distinct medium/high C3 insert-or-promote (company, acquirer) pairs
    recovered in held-out cut 1501-2500.
  numerator: 4
  denominator: 307
  interval_low: 0.0051
  interval_high: 0.0330
  interval_method: Wilson 95%
  threshold_met: false
  # False, and the reason is dispositive rather than a judgement call. The
  # pinned design bytes e7090020 first exist in git at commit 9bcb6dc9,
  # 2026-09-09 07:30 EDT. The replay ran 2026-09-08 21:25 EDT and the capture
  # ran 09-07 to 09-08. The design was pinned about ten hours after the run it
  # is supposed to have preregistered, so confirmatory is false on the schema's
  # own wording. Evidence audit 2026-09-13.
  confirmatory: false
  post_hoc_analyses:
    - >-
      The unverified_empty retry class was introduced at f34266c5 on 2026-09-08
      19:00 and applied to 476 of the 1000 rows after those rows existed and
      after their emptiness was observable. Retry eligibility must be
      pre-specified; re-querying changes the snippets freeze that determines the
      number.
    - >-
      The fault/retry validity precondition, including the rule that a recall
      miss carrying faults is "not measured", was added to held-out-1501.md
      while 948 of 1000 pairs were already captured. A rule about when a miss
      counts as a miss, authored after the data existed.
    - >-
      The 307 strict-eligible denominator is a replay output, not a
      preregistered quantity. The preregistered gate is a count floor of 10 over
      the 1000-pair cut. The interval above is therefore a post-hoc enumeration;
      it does not change threshold_met, since 4 is below 10 on any denominator.
    - >-
      An earlier capture scored 528 of 1000 pairs and reported
      strict_medium_high_n 2. It is superseded by the 1000-pair replay recorded
      here.
    - >-
      held-out-run-manifest.json provenance_defects[2] states in the present
      tense that held-out-1501.md "as currently frozen" carries a false claim
      about what had touched pairs 1501+. That was true of an earlier version;
      the pinned e7090020 bytes contain the correction and the superseded hash.
      The frozen manifest now misdescribes another frozen artifact. Recorded
      here rather than edited in place, because a corrected frozen artifact is a
      new version.
